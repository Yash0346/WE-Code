
<html>
<head> <title>Map tracker </title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style> #map { height: 300px;} 
#astrotable {
border-width: 359px;
}
#astrotable th,
#astrotable td {
 border: 5px solid black;
 padding: 10px;
 text-align: center;
}
#astrotable th{
background-color: lightcyan;
}

    </style>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>

    <h1> Satellite tracking </h1>
    <div id="map"></div>
   <p> Latitude  <span id="latitude"></span>  </p>
    <p> Longitude <span id="longitude"></span>  </p>
    <div id="Astronauts">
        <h2> Astronauts in Space </h2>
        <table id="astrotable">
    <tr>
        <th>Name of the Astroonaut </th>
        <th> Spacecraft Name</th>

    </tr>
    </table>
    </div>
    
    
</body> 


<script>
var map = L.map('map').setView([51.505, -0.09], 13);

let lat;
let lon;

let previousLat = null;
let previousLon = null;

// Create one ISS marker and one prediction marker
let issMarker = L.marker([0, 0]).addTo(map).bindPopup("Current ISS Location");

let predictionMarker = L.circleMarker([0, 0], {
    color: 'red',
    radius: 4,
    fillOpacity: 0.8
}).addTo(map).bindPopup("Predicted Next Position");

getAstronautslocation();
setInterval(getIssLocation, 5000);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker = L.marker([51.5, -0.09]).addTo(map);

var circle = L.circle([51.508, -0.11], {
    color: 'red',
    fillColor: '#f03',
    fillOpacity: 0.5,
    radius: 500
}).addTo(map);

var polygon = L.polygon([
    [51.509, -0.08],
    [51.503, -0.06],
    [51.51, -0.047]
]).addTo(map);

var monumentIcon = L.icon({
    iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149059.png',
    iconSize : [20,20],
    iconAnchor:[20,40],
    popupAnchor: [0,-40]
});

var monuments = [
    {
        name: "Great Wall of China",
        location: [40.45, 116.5506]
    },
    {
        name: "Taj Mahal",
        location: [27.1731, 78.0417]
    },
    {
        name: "Colosseum",
        location: [41.8906, 12.4917]
    },
    {
        name: "Chichen Itza",
        location: [20.6844, -88.5675]
    },
    {
        name:"Machu picchu",
        location:[-13.1625, -72.545]

    },
    {
        name:"Christ the Redeemer",
        location:[-22.9517, -43.2103]
    },
    
    {
        name:"Petra",
        location:[30.3283, 35.4444]
    },
  
];


monuments.forEach(function(monument) {
    L.marker(monument.location, {
        icon: monumentIcon
    })
    .addTo(map)
    .bindPopup(monument.name);
});



marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
circle.bindPopup("I am a circle.");
polygon.bindPopup("I am a polygon.");


getIssLocation();

var popup = L.popup()
    .setLatLng([51.513, -0.09])
    .setContent("I am a standalone popup.")
    .openOn(map);

function onMapClick(e) {
    alert("You clicked the map at " + e.latlng);
}

map.on('click', onMapClick);


var popup = L.popup();

function onMapClick(e) {
    popup
        .setLatLng(e.latlng)
        .setContent("You clicked the map at " + e.latlng.toString())
        .openOn(map);
}

map.on('click', onMapClick);

function getIssLocation() {
    const url = "http://api.open-notify.org/iss-now.json";
    var result = fetch(url)
        .then(response => response.json())
        .then((data) => {
            console.log(data.iss_position.latitude);
            console.log(data.iss_position.longitude);
            document.getElementById('longitude').innerText = data.iss_position.longitude;
            document.getElementById('latitude').innerText = data.iss_position.latitude;
            
            lon = parseFloat(data.iss_position.longitude);
            lat = parseFloat(data.iss_position.latitude);
            
            plotLocation(lat, lon);
         });

}
function plotLocation(latitude, longitude) {
    issMarker.setLatLng([latitude, longitude]);

    // Calculate prediction only after receiving 2 location updates
    if (previousLat !== null && previousLon !== null) {
        let predictedLat = latitude + (latitude - previousLat);
        let predictedLon = longitude + (longitude - previousLon);

        predictionMarker.setLatLng([predictedLat, predictedLon]);
    } else {
        // First run fallback
        predictionMarker.setLatLng([latitude, longitude]);
    }

    // Save position for next comparison
    previousLat = latitude;
    previousLon = longitude;

    // Center map on ISS

}

    

function getAstronautslocation(){
    const url = "http://api.open-notify.org/astros.json";
    var result = fetch(url)
        .then(response => response.json())
        .then((data) => {
            console.log (`Number of people in space: ${data.number}`);
            var table = document.getElementById('astrotable');
            data.people.forEach(person => {
                //document.getElementById('Astronauts').append(`${person.name} is on spacecraft ${person.craft}`);
                //document.getElementById('Astronauts').append(document.createElement("br"));
                var row = table.insertRow();
                var nameCell = row.insertCell(0);
                var craftCell = row.insertCell(1);
                nameCell.innerText = person.name;
                craftCell.innerText = person.craft;
                console.log(`${person.name} is on spacecraft ${person.craft}`);
                

            
            })
        });


    }

 

</script>

</html>
